name: Raporu güncelle
run-name: ${{ inputs.mod == 'siparis' && 'Depo siparişleri' || 'Tam güncelleme' }}

on:
  workflow_dispatch:   # web sayfasındaki butonlar ya da Actions sekmesindeki "Run workflow"
    inputs:
      mod:
        description: "tam = stok raporu + depo siparişleri · siparis = sadece depo siparişleri (hızlı)"
        required: false
        default: tam
        type: choice
        options: [tam, siparis]

concurrency:
  group: hareketsiz-stok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paket
        run: pip install --quiet cryptography

      - name: Önceki dosyaları al
        run: |
          mkdir -p kod/onceki
          if git fetch --quiet --depth 1 origin veri 2>/dev/null; then
            for f in onbellek.enc rapor.enc siparis.enc; do
              git show "FETCH_HEAD:$f" > "kod/onceki/$f" 2>/dev/null || rm -f "kod/onceki/$f"
            done
          fi
          ls -la kod/onceki

      - name: Pobol'dan veriyi çek
        env:
          BULUT_MOD: ${{ inputs.mod || 'tam' }}
          POBOL_KULLANICI: ${{ secrets.POBOL_KULLANICI }}
          POBOL_SIFRE: ${{ secrets.POBOL_SIFRE }}
          RAPOR_SIFRESI: ${{ secrets.RAPOR_SIFRESI }}
          WEB_ERISIM_TOKEN: ${{ secrets.WEB_ERISIM_TOKEN }}
          POBOL_ADRES: ${{ vars.POBOL_ADRES }}
          HARIC_RAFLAR: ${{ vars.HARIC_RAFLAR }}
        run: python -u kod/bulut.py

      - name: Şifreli dosyaları 'veri' dalına yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cikti
          git init --quiet -b veri
          git config user.name "rapor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Rapor $(date '+%d.%m.%Y %H:%M') (${{ inputs.mod || 'tam' }})"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" veri
